plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.12'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.12')
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.security:spring-security-crypto'
    // 부장님 매매 판단·대사(선택). OPENAI_API_KEY가 있으면 OpenAI, 없고 ANTHROPIC_API_KEY가 있으면 Claude.
    implementation 'com.openai:openai-java:4.114.0'
    implementation 'com.anthropic:anthropic-java:3.3.0'
    runtimeOnly 'org.postgresql:postgresql'

    // Boot 3.2가 정한 Testcontainers 1.19는 Docker 29(API 1.40 미만 거절)와 통신하지 못해 올린다.
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 판에서는 부장님이 API를 부르지 않는다(비용·시간). 규칙 판단만 쓴다.
    systemProperty 'game.boss-llm-provider', 'off'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
