<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부장님 몰래 · 대기실</title>
<style>
  #news {
    position: fixed;
    inset: 1rem 1rem auto auto;
    z-index: 1;
    max-width: min(24rem, calc(100vw - 4rem));
    margin: 0;
    padding: .75rem 1rem;
    border-radius: .5rem;
    background: #182536;
    color: white;
    pointer-events: none;
  }
  #news strong { display: block; }
  /* 팝업 본문은 한 줄만 보이고, 넘치면 …로 줄인다. 전체는 알림창에서 읽는다. */
  #news .body {
    display: block;
    margin-top: .25rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: .85;
  }
</style>
<main>
  <h1>부장님 몰래</h1>
  <fieldset id="entry" disabled>
    <legend>대기실</legend>
    <button id="create">방 만들기</button>
    <label>초대 코드 <input id="code" maxlength="6" inputmode="numeric"></label>
    <button id="join">입장</button>
  </fieldset>
  <section id="lobby" hidden>
    <h2 id="roomTitle"></h2>
    <p id="players"></p>
    <button id="start" hidden>게임 시작</button>
  </section>
  <p id="clock" hidden></p>
  <button id="switchView" hidden>주식 창 열기 (Tab)</button>
  <p id="meeting" role="status" hidden>부장님과 면담 중입니다.</p>
  <p id="balance" hidden></p>
  <p id="news" role="status" hidden></p>
  <details id="inbox" hidden>
    <summary>뉴스 알림창</summary>
    <p id="historyStatus"></p>
    <ol id="historyList" reversed></ol>
  </details>
  <section id="work" hidden>
    <h2>업무 · 매출 합계 입력</h2>
    <table>
      <caption id="taskTitle"></caption>
      <tbody>
        <tr><th scope="row">A1</th><td id="a1"></td></tr>
        <tr><th scope="row">A2</th><td id="a2"></td></tr>
      </tbody>
    </table>
    <form id="answerForm">
      <label>A1과 A2의 합계 <input id="answer" type="number" step="1" required></label>
      <button>제출</button>
    </form>
  </section>
  <section id="market" hidden>
    <h2>주식 거래</h2>
    <table>
      <thead><tr><th>종목</th><th>기준가</th><th>내 보유량</th></tr></thead>
      <tbody id="quotes"></tbody>
    </table>
    <form id="order">
      <label>종목 <select id="symbol"></select></label>
      <label>수량 <input id="quantity" type="number" min="1" step="1" value="1" required></label>
      <button value="BUY">매수</button>
      <button value="SELL">매도</button>
    </form>
    <p id="estimate" aria-live="polite"></p>
    <p id="fill" role="status"></p>
  </section>
  <section id="results" hidden>
    <h2>퇴근! 최종 순위</h2>
    <table>
      <thead><tr><th>순위</th><th>직원</th><th>순자산</th><th>현금</th><th>주식 청산가</th><th>업무 수당</th><th>보유 주식</th></tr></thead>
      <tbody id="standings"></tbody>
    </table>
    <p>주식은 퇴근 순간 혼자 전부 팔았을 때 받을 금액으로 평가합니다.</p>
    <h3>매매 기록</h3>
    <p id="tradesEmpty" hidden>이번 판에는 아무도 주식을 거래하지 않았습니다.</p>
    <table>
      <thead><tr><th>시각</th><th>직원</th><th>종목</th><th>구분</th><th>수량</th><th>금액</th></tr></thead>
      <tbody id="trades"></tbody>
    </table>
  </section>
  <p id="status" role="status">연결 중…</p>
</main>
<script type="module">
  const el = id => document.getElementById(id);
  const url = new URL('/ws/lobby', location.href);
  url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const socket = new WebSocket(url);
  socket.onopen = () => {
    el('entry').disabled = false;
    el('status').textContent = '친구에게 받은 코드로 입장하거나 방을 만드세요.';
  };
  el('create').onclick = () => socket.send('CREATE');
  el('join').onclick = () => socket.send('JOIN ' + el('code').value.trim());
  el('start').onclick = () => socket.send('START');
  let taskNumber = null;
  let audio;
  let lastStep = -1;
  function enableSound() {
    audio ??= new AudioContext();
    audio.resume().catch(() => {});
  }
  for (const id of ['create', 'join', 'start', 'switchView']) {
    el(id).addEventListener('click', enableSound);
  }
  function footsteps({from, to, listener}) {
    if (audio?.state !== 'running') return;
    for (const delay of [0, 0.5, 1, 1.5]) {
      const t = audio.currentTime + delay;
      const sound = audio.createOscillator();
      const gain = audio.createGain();
      const fraction = delay / 2;
      const x = from.x + (to.x - from.x) * fraction - listener.position.x;
      const z = from.z + (to.z - from.z) * fraction - listener.position.z;
      // Web Audio listener faces -Z, with +X to its right.
      const pan = new PannerNode(audio, {
        panningModel: 'HRTF', distanceModel: 'inverse', refDistance: 1,
        positionX: -listener.forwardZ * x, positionY: -1, positionZ: -listener.forwardZ * z
      });
      sound.frequency.setValueAtTime(120, t);
      sound.frequency.exponentialRampToValueAtTime(55, t + 0.1);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.19, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      sound.connect(gain).connect(pan).connect(audio.destination);
      sound.start(t);
      sound.stop(t + 0.16);
      sound.onended = () => { sound.disconnect(); gain.disconnect(); pan.disconnect(); };
    }
  }
  function showView(view) {
    const seated = view === 'WORK' || view === 'MARKET';
    el('work').hidden = view !== 'WORK';
    el('market').hidden = view !== 'MARKET';
    el('meeting').hidden = view !== 'MEETING';
    el('switchView').hidden = el('balance').hidden = el('inbox').hidden = !seated;
    el('switchView').textContent = view === 'WORK' ? '주식 창 열기 (Tab)' : '업무 창 열기 (Tab)';
    if (!seated) {
      el('inbox').open = false;
      el('news').hidden = true;
    }
  }
  el('switchView').onclick = () => socket.send('SWITCH');
  document.addEventListener('keydown', event => {
    if (event.key !== 'Tab' || event.shiftKey || event.altKey || event.ctrlKey ||
        event.metaKey || el('switchView').hidden) return;
    event.preventDefault();
    if (!event.repeat) socket.send('SWITCH');
  });
  const won = value => value.toLocaleString('ko-KR') + '원';
  el('order').onsubmit = event => {
    event.preventDefault();
    const side = event.submitter?.value;
    if (!side || socket.readyState !== WebSocket.OPEN) return;
    socket.send([side, el('symbol').value, el('quantity').value].join(' '));
  };

  let lastNewsNumber = 0;
  let popupTimer;

  // 서버 StockPool과 같은 계산: 풀에 남는 현금을 올림하므로 매수 대금은 올림, 매도 대금은 내림.
  let pools = {};
  let holdingsNow = {};
  // 서버는 종목을 코드(MINT 등)로 주고받는다. 화면에는 catalog 메시지로 받은 이름을 보여준다.
  let stocks = [];
  const stockName = id => stocks.find(s => s.id === id)?.name ?? id;
  let cashNow = 0n;
  const ceilDiv = (a, b) => (a + b - 1n) / b;
  function quote(symbol, quantity) {
    const pool = pools[symbol];
    if (!pool || !(quantity > 0n)) return null;
    const shares = BigInt(pool.shares), cash = BigInt(pool.cashWon), k = shares * cash;
    const buy = quantity < shares ? ceilDiv(k, shares - quantity) - cash : null;
    const sell = cash - ceilDiv(k, shares + quantity);
    return {buy, sell};
  }
  function renderEstimate() {
    const out = el('estimate');
    let quantity;
    try { quantity = BigInt(el('quantity').value); } catch { quantity = 0n; }
    const symbol = el('symbol').value;
    const q = quote(symbol, quantity);
    if (!q) { out.textContent = ''; return; }
    const owned = BigInt(holdingsNow[symbol] ?? 0);
    const avg = amount => won(Number(amount / quantity)) + '/주';
    const buyText = q.buy === null ? '매수 불가 (풀 수량 초과)'
      : '예상 매수 금액 ' + won(Number(q.buy)) + ' (평균 ' + avg(q.buy) + ')' +
        (q.buy > cashNow ? ' · 현금 부족' : '');
    const sellText = quantity > owned ? '매도 불가 (보유 ' + owned + '주)'
      : '예상 매도 금액 ' + won(Number(q.sell)) + ' (평균 ' + avg(q.sell) + ')';
    out.textContent = buyText + ' · ' + sellText + ' — 주문이 도착할 때 시세가 바뀌면 달라질 수 있습니다.';
  }
  el('quantity').addEventListener('input', renderEstimate);
  el('symbol').addEventListener('change', renderEstimate);

  function requestHistory() {
    if (socket.readyState === WebSocket.OPEN && el('inbox').open) {
      socket.send('NEWS HISTORY');
    }
  }
  el('inbox').ontoggle = requestHistory;

  const newsLabel = kind => kind === 'rumor' ? '찌라시 · ' : '속보 · ';

  function renderHistory(items) {
    const list = el('historyList');
    list.replaceChildren();
    el('historyStatus').textContent = items.length ? '' : '아직 발표된 뉴스가 없습니다.';
    for (const item of [...items].reverse()) {
      const row = document.createElement('li');
      row.value = item.number;
      const title = document.createElement('strong');
      title.textContent = newsLabel(item.kind) + item.headline;
      row.append(title);
      if (item.body) {
        const body = document.createElement('p');
        body.textContent = item.body;
        body.style.margin = '.25rem 0 .75rem';
        row.append(body);
      }
      list.append(row);
    }
  }

  function clearNews() {
    clearTimeout(popupTimer);
    lastNewsNumber = 0;
    lastStep = -1;
    showView(null);
    el('news').hidden = true;
    el('news').textContent = '';
    el('inbox').open = false;
    el('inbox').hidden = true;
    el('historyList').replaceChildren();
    el('historyStatus').textContent = '';
    el('estimate').textContent = '';
    el('clock').hidden = true;
    pools = {};
    holdingsNow = {};
  }

  const clockText = seconds => Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  function renderClock(remainingSeconds) {
    const clock = el('clock');
    clock.hidden = false;
    clock.textContent = '퇴근까지 ' + clockText(remainingSeconds) +
      (remainingSeconds <= 120 ? ' · 장 마감 직전, 시세가 크게 흔들립니다' : '');
  }

  function renderResults({you, standings, trades}) {
    showView(null);
    el('clock').hidden = true;
    el('news').hidden = true;
    clearTimeout(popupTimer);
    const body = el('standings');
    body.replaceChildren();
    for (const row of standings) {
      const tr = body.insertRow();
      const holdings = Object.entries(row.holdings).map(([s, q]) => stockName(s) + ' ' + q + '주').join(', ') || '없음';
      for (const text of [row.rank + '위', row.player + (row.player === you ? ' (나)' : ''),
          won(row.netWorthWon), won(row.cashWon), won(row.stockValueWon),
          won(row.workIncomeWon) + ' (' + row.completedTasks + '건)', holdings]) {
        tr.insertCell().textContent = text;
      }
      if (row.player === you) tr.style.fontWeight = 'bold';
    }
    const log = el('trades');
    log.replaceChildren();
    el('tradesEmpty').hidden = trades.length > 0;
    for (const t of trades) {
      const tr = log.insertRow();
      for (const text of [clockText(t.second), t.player, stockName(t.symbol), t.side, t.quantity + '주', won(t.amountWon)]) {
        tr.insertCell().textContent = text;
      }
    }
    el('results').hidden = false;
    const mine = standings.find(row => row.player === you);
    el('status').textContent = mine ? '퇴근했습니다. ' + mine.rank + '위 · 순자산 ' + won(mine.netWorthWon) : '퇴근했습니다.';
  }

  function renderMarket({prices, pools: nextPools, holdings, headline, newsKind, newsBody, newsNumber, view, beat, walking, step, remainingSeconds}) {
    showView(view);
    renderClock(remainingSeconds);
    pools = nextPools;
    holdingsNow = holdings;
    if (walking && lastStep !== beat) {
      lastStep = beat;
      footsteps(step);
    }
    const news = el('news');
    el('inbox').hidden = false;
    if (newsNumber > lastNewsNumber) {
      lastNewsNumber = newsNumber;
      const title = document.createElement('strong');
      title.textContent = newsLabel(newsKind) + headline;
      news.replaceChildren(title);
      if (newsBody) {
        const line = document.createElement('span');
        line.className = 'body';
        line.textContent = newsBody;
        news.append(line);
      }
      news.hidden = false;
      clearTimeout(popupTimer);
      popupTimer = setTimeout(() => { news.hidden = true; }, newsBody ? 5000 : 4000);
      requestHistory();
    }
    const symbols = stocks.map(s => s.id).filter(id => id in prices);
    const select = el('symbol');
    if (select.options.length === 0) {
      for (const symbol of symbols) select.add(new Option(stockName(symbol), symbol));
    }
    el('quotes').replaceChildren();
    for (const symbol of symbols) {
      const row = el('quotes').insertRow();
      row.insertCell().textContent = stockName(symbol);
      row.insertCell().textContent = won(prices[symbol]);
      row.insertCell().textContent = (holdings[symbol] ?? 0) + '주';
    }
    renderEstimate();
  }
  el('answerForm').onsubmit = event => {
    event.preventDefault();
    if (taskNumber !== null && socket.readyState === WebSocket.OPEN) {
      socket.send('WORK ' + taskNumber + ' ' + el('answer').value);
    }
  };
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.type === 'state') {
      const {room, code, you} = message;
      // 새 방의 대기 상태일 때만 지난 판 결과를 치운다(퇴근 뒤 누가 나가도 결과는 남는다).
      if (!room.startedAt) el('results').hidden = true;
      el('entry').hidden = true;
      el('lobby').hidden = false;
      el('roomTitle').textContent = '초대 코드 ' + code;
      el('players').textContent = '참가자 ' + room.players.length + ' / 4명';
      el('start').hidden = you !== room.hostId || Boolean(room.startedAt);
      el('start').disabled = room.players.length < 2;
      // 퇴근 뒤 누가 나가 참가자 수가 바뀌어도 결과 문구는 그대로 둔다.
      if (el('results').hidden) el('status').textContent = room.startedAt
        ? '게임 시작 · ' + new Date(room.startedAt).toLocaleTimeString('ko-KR')
        : '시작 대기 중';
    } else if (message.type === 'view') {
      showView(message.view);
    } else if (message.type === 'meeting') {
      lastNewsNumber = Math.max(lastNewsNumber, message.newsNumber);
      showView('MEETING');
    } else if (message.type === 'market') {
      renderMarket(message);
    } else if (message.type === 'catalog') {
      stocks = message.stocks;
    } else if (message.type === 'result') {
      renderResults(message);
    } else if (message.type === 'newsHistory') {
      renderHistory(message.items);
    } else if (message.type === 'fill') {
      el('fill').textContent =
        stockName(message.symbol) + ' ' + message.quantity + '주 ' + message.side +
        ' 체결 · 총 ' + won(message.amount);
    } else if (message.type === 'work') {
      const {task, balance, rewardWon} = message.desk;
      const advanced = taskNumber !== null && task.number > taskNumber;
      taskNumber = task.number;
      cashNow = BigInt(balance.cashWon);
      renderEstimate();
      el('balance').textContent =
        '내 현금 ' + won(balance.cashWon) + ' · 누적 업무 수당 ' + won(balance.workIncomeWon);
      el('taskTitle').textContent = '업무 ' + task.number + ' · 완료 수당 ' + won(rewardWon);
      el('a1').textContent = task.a1;
      el('a2').textContent = task.a2;
      if (advanced) {
        el('status').textContent = '업무 완료 · ' + won(rewardWon) + ' 지급';
        el('answer').value = '';
        el('answer').focus();
      }
    } else {
      el('status').textContent = message.message;
      if (message.type === 'closed') {
        clearNews();
        el('market').hidden = true;
        el('fill').textContent = '';
        el('symbol').replaceChildren();
        taskNumber = null;
        el('work').hidden = true;
        el('answer').value = '';
        el('lobby').hidden = true;
        el('entry').hidden = false;
      }
    }
  };
  socket.onclose = () => {
    clearNews();
    el('market').hidden = true;
    taskNumber = null;
    el('work').hidden = true;
    el('entry').disabled = true;
    el('start').disabled = true;
    el('status').textContent = '연결이 끊겼습니다. 새로고침해 다시 접속하세요.';
  };
</script>
</html>
