game.starting-cash-won=10000000
game.work-reward-won=35000
# 출근부터 퇴근까지(초). 테스트할 때는 --game.session-seconds=60 처럼 줄인다.
game.session-seconds=900
# 점심시간에 부장님이 공지보다 20초 일찍 돌아올 확률
game.lunch-early-return-chance=0.2
# 비상 대출: 누구나 한 판에 한 번 최대 loan-max-won까지 빌리고, 퇴근 때 원금에 이 비율(%)의 이자를 더해 뺀다
game.loan-interest-percent=20
game.loan-max-won=10000000
# 거래 비용(bp, 20 = 0.2%). 사고팔 때 각각 붙는다
game.trade-fee-bps=20
# 신용 매수: 빚에 1분마다 붙는 이자(bp, 10 = 0.1%), 유지 비율(%). 담보 비율이 유지 비율 아래로 떨어지면 반대매매
game.margin-interest-bps-per-minute=10
game.margin-maintenance-percent=10
game.playtest-log=playtest/work-times.csv
# 한 판에 상장하는 일반 종목 수(무작위). 기초 종목이 뽑힌 레버리지 종목은 따로 더해진다. 0이면 전부.
game.stocks-per-game=12
game.stock-catalog=classpath:market/stocks.json
game.news-catalog=classpath:market/news.json
# WebSocket 연결을 허용할 화면 주소(쉼표로 구분, * 패턴 가능). 서버와 같은 주소는 항상 허용된다.
# 따로 만든 프론트엔드의 개발 서버(Vite 등)와 배포 주소를 추가한다. 예: https://office-stock.example.com
# Cloudflare 터널 주소(https://….trycloudflare.com)로 연 화면도 받아 준다.
game.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://*.trycloudflare.com
server.forward-headers-strategy=framework
# 프로필(이름·꾸미기)과 판 결과를 저장하는 PostgreSQL. 개발 때는 docker compose up -d 로 켠다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/officestock}
spring.datasource.username=${DB_USER:officestock}
spring.datasource.password=${DB_PASSWORD:officestock}
# 표는 Flyway가 db/migration의 SQL로 만든다. JPA는 맞는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
